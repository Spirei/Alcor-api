name: Isolated platform checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: isolated-platform-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.23'
          enable-cache: true
      - run: python3 tools/audit-source.py
      - run: uv sync --locked
      - run: npm ci
      - run: uv run python tools/bootstrap-redis.py
      - run: uv run python tools/test-shard.py --index ${{ matrix.shard }} --count 8
      - run: uv run alcor export-openapi
        if: matrix.shard == 0
      - run: npm run types:api
        if: matrix.shard == 0
      - run: git diff --exit-code -- contracts/platform.openapi.json apps/web/src/generated/api.d.ts
        if: matrix.shard == 0
      - run: npm run test:web
        if: matrix.shard == 0
      - run: npm run build
        if: matrix.shard == 0
      - run: uv run python tools/validate-deployment.py --root .
        if: matrix.shard == 0
      - name: 验证发布配置对应的镜像与数据库工具
        env:
          PG_MAJOR: ${{ vars.ALCOR_PG_MAJOR || '16' }}
          REVISION: ${{ github.sha }}
        run: |
          docker build --build-arg APP_VERSION="$(node -p 'require("./package.json").version')" --build-arg SOURCE_REVISION="$REVISION" --build-arg PG_MAJOR="$PG_MAJOR" -f deploy/Dockerfile -t alcor-api:ci .
          docker run --rm --network none --entrypoint "/usr/lib/postgresql/$PG_MAJOR/bin/pg_dump" alcor-api:ci --version
        if: matrix.shard == 0
  updater:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv sync --locked
      - run: docker build --build-arg SOURCE_REVISION="${{ github.sha }}" -f deploy/Dockerfile.updater -t alcor-api-updater:ci .
      - run: ALCOR_TEST_DOCKER=1 uv run pytest -q --tb=short tests/test_updater_docker.py
