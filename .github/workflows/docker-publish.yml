name: Publish AlcorApi
run-name: "${{ inputs.verify_only && 'ci: 验证 AlcorApi 发布流程' || 'feat: 发布 AlcorApi 统一迁移版本' }}"
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 部署请求回执，保留在运行详情中
        required: false
        type: string
      verify_only:
        description: 仅验证完整构建流程，不上传镜像或创建发布
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: alcor-api-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 核实同一提交的完整检查
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: python3 tools/release-checks.py
      - name: 核对发布版本与结构标识
        id: identity
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          h=hashlib.sha256()
          for path in sorted(Path('migrations').glob('*.sql')):
              h.update(path.name.encode()+b'\0'+path.read_bytes()+b'\0')
          values={'version':json.loads(Path('package.json').read_text())['version'], 'schema':h.hexdigest(), 'image':'ghcr.io/'+os.environ['REPOSITORY'].lower()}
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              for key,value in values.items(): print(key+'='+value,file=out)
          PY
      - name: 核对同一提交的已有发布
        id: existing
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.identity.outputs.version }}
          SCHEMA: ${{ steps.identity.outputs.schema }}
          IMAGE: ${{ steps.identity.outputs.image }}
          REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request,urllib.error
          tag='alcor-v'+os.environ['VERSION']+'-'+os.environ['REVISION']
          request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GH_REPO']+'/releases/tags/'+tag,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          exists=False
          try:
              with urllib.request.urlopen(request,timeout=15) as response: record=json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code!=404: raise
          else:
              release=json.loads(record['body'])
              assert not record['draft'] and not record['prerelease']
              assert record['target_commitish']==os.environ['REVISION']
              assert release['version']==os.environ['VERSION'] and release['schema_hash']==os.environ['SCHEMA'] and release['revision']==os.environ['REVISION']
              assert re.fullmatch(re.escape(os.environ['IMAGE'])+r'@sha256:[a-f0-9]{64}',release['image'])
              exists=True
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: print('reuse='+str(exists).lower(),file=out)
          PY
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.existing.outputs.reuse != 'true'
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.existing.outputs.reuse != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建更新器镜像
        if: steps.existing.outputs.reuse != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.updater
          platforms: linux/amd64
          push: ${{ !inputs.verify_only }}
          load: ${{ inputs.verify_only }}
          tags: |
            ${{ steps.identity.outputs.image }}-updater:latest
            ${{ steps.identity.outputs.image }}-updater:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.identity.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.existing.outputs.reuse != 'true'
        id: image
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: ${{ !inputs.verify_only }}
          load: ${{ inputs.verify_only }}
          tags: |
            ${{ steps.identity.outputs.image }}:latest
            ${{ steps.identity.outputs.image }}:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.identity.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
            SCHEMA_HASH=${{ steps.identity.outputs.schema }}
            PG_MAJOR=${{ vars.ALCOR_PG_MAJOR || '16' }}
      - name: 发布不可变版本清单
        if: ${{ !inputs.verify_only && steps.existing.outputs.reuse != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.identity.outputs.image }}@${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.identity.outputs.version }}
          SCHEMA: ${{ steps.identity.outputs.schema }}
          REVISION: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          Path('release-manifest.json').write_text(json.dumps({'version':os.environ['VERSION'],'image':os.environ['IMAGE'],'revision':os.environ['REVISION'],'schema_hash':os.environ['SCHEMA']}))
          PY
          gh release create "alcor-v${VERSION}-${REVISION}" --target "$REVISION" --title "AlcorApi ${VERSION}" --notes-file release-manifest.json --latest
      - name: 记录运行详情
        env:
          VERIFY_ONLY: ${{ inputs.verify_only }}
          REQUEST_ID: ${{ inputs.request_id }}
          REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              print('## 发布流程校验' if os.environ['VERIFY_ONLY'] == 'true' else '## 发布详情', file=output)
              print('提交：`' + os.environ['REVISION'] + '`', file=output)
              if os.environ['REQUEST_ID']:
                  print('请求回执：`' + os.environ['REQUEST_ID'].replace('\r', '').replace('\n', '') + '`', file=output)
              if os.environ['VERIFY_ONLY'] == 'true':
                  print('完整构建已执行；本次未上传镜像或创建发布，现有发布保持不变。', file=output)
          PY
