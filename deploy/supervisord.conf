[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=%(ENV_ALCOR_RUNTIME)s/supervisord.pid
childlogdir=%(ENV_ALCOR_RUNTIME)s

[unix_http_server]
file=%(ENV_ALCOR_RUNTIME)s/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_ALCOR_RUNTIME)s/supervisor.sock

[program:api]
directory=%(ENV_ALCOR_ROOT)s
command="%(ENV_ALCOR_PYTHON)s" -m uvicorn alcor_api.main:create_app --factory --host %(ENV_ALCOR_BIND_HOST)s --port %(ENV_ALCOR_PORT)s --workers 1 --no-proxy-headers --no-access-log
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:worker]
directory=%(ENV_ALCOR_ROOT)s
command="%(ENV_ALCOR_PYTHON)s" -m alcor_api.worker
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
