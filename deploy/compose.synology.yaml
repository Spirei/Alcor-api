# 群晖 Container Manager 项目模板；先填写同目录 .env。
name: alcor-api
services:
  app:
    # 长期使用 latest；实际版本由镜像自身提供，更新器核对本次解析的 digest。
    image: ${ALCOR_APP_IMAGE:?请填写应用镜像的latest标签}
    platform: linux/amd64
    container_name: alcor-api
    hostname: alcor-api
    restart: unless-stopped
    init: true
    # 默认供 DSM 反向代理访问。
    ports:
      - "127.0.0.1:8088:8080"
    env_file:
      - .env
    environment:
      ALCOR_DEPLOYMENT_UPDATER_URL: http://alcor-api-updater:8081
      ALCOR_CONNECTION_SECRET_DIR: /var/lib/alcor/state/connection-secrets
      ALCOR_FILE_ROOT: /var/lib/alcor/uploads
      ALCOR_ASSET_ROOT: /var/lib/alcor/assets
      ALCOR_BACKUP_DIR: /var/lib/alcor/backups
      ALCOR_BACKUP_SECRET_DIR: /var/lib/alcor/backup-key
    # ALCOR_DATA_DIR 在本机 .env 中填写，Git 模板不预设个人地址。
    volumes:
      # 应用状态和连接密钥；不包含 PostgreSQL 数据卷。
      - ${ALCOR_DATA_DIR}/state:/var/lib/alcor/state
      # 私有用户文件。应用按内容摘要保存；头像目前仍保存在 PG。
      - ${ALCOR_DATA_DIR}/uploads:/var/lib/alcor/uploads
      # 自定义素材：容器只读，管理员下载访问；不直接公开整个文件夹。
      - ${ALCOR_DATA_DIR}/images:/var/lib/alcor/assets:ro
      # 加密联合备份（数据库、用户文件及已配置素材）。
      - ${ALCOR_DATA_DIR}/backups:/var/lib/alcor/backups
      # 备份恢复密钥独立保存，另留安全副本。
      - ${ALCOR_DATA_DIR}/backup-key:/var/lib/alcor/backup-key
    networks:
      - existing-data
      - update-control
    labels:
      com.alcor.update.scope: alcor-api
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: alcor-api
    read_only: true
    tmpfs:
      - /app/run:uid=10001,gid=10001,mode=0700
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 与镜像内健康检查一致：API 数据库及 Worker 心跳。
    healthcheck:
      test: ["CMD", "python", "/app/deploy/healthcheck.py", "api"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 45s
    stop_grace_period: 45s
  alcor-api-updater:
    image: ${ALCOR_DEPLOYMENT_IMAGE:?请填写应用镜像仓库名}-updater:latest
    platform: linux/amd64
    container_name: alcor-api-updater
    restart: unless-stopped
    environment:
      ALCOR_UPDATER_ORIGIN: http://app:8080
      ALCOR_UPDATER_TOKEN: ${ALCOR_DEPLOYMENT_RUNNER_TOKEN:?请设置独立更新器随机密钥}
      ALCOR_UPDATER_APP_IMAGE: ${ALCOR_DEPLOYMENT_IMAGE:?请填写应用镜像仓库名}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_DIR:?请填写GHCR登录配置目录}:/config:ro
      - updater-state:/state
    networks: [update-control]
    read_only: true
    tmpfs: ["/tmp:mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: alcor-api
networks:
  update-control:
    internal: true
  existing-data:
    external: true
    name: ${ALCOR_EXISTING_NETWORK:?请填写现有PG和Redis所在网络}
# 先创建以上五个宿主机目录，属主10001:10001、权限0700。
# images中素材文件属主同上、权限0600，使用平铺文件名；不放凭据或密钥。
# 容器启动不会执行数据库迁移，也不会迁移已有 state/files 或 PG 头像。
# 首次部署后若配置网页更新执行器，固定compose.yaml应使用此模板的同一份配置。
# 更新器状态使用独立持久卷，root 所有、0700；不挂入应用，不包含数据库卷。

volumes:
  updater-state:
