# App and its private updater. Existing PostgreSQL and Redis remain external dependencies.
name: alcor-api
services:
  app:
    platform: ${ALCOR_PLATFORM:-linux/amd64}
    image: ${ALCOR_APP_IMAGE:?Set the application latest image reference}
    restart: unless-stopped
    init: true
    env_file:
      - ./app.env
    environment:
      ALCOR_DEPLOYMENT_UPDATER_URL: http://alcor-api-updater:8081
    ports:
      - "127.0.0.1:${ALCOR_HOST_PORT:-8088}:8080"
    networks:
      - existing-data
      - update-control
    labels:
      com.alcor.update.scope: alcor-api
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: alcor-api
    read_only: true
    volumes:
      # Private application files; avatars currently remain in PostgreSQL.
      - type: bind
        source: ${ALCOR_UPLOADS_DIR:?Set the private uploads directory}
        target: /var/lib/alcor/uploads
        bind:
          create_host_path: false
      # Operator-managed assets. The container can read, but cannot change them.
      - type: bind
        source: ${ALCOR_ASSETS_DIR:?Set the private assets directory}
        target: /var/lib/alcor/assets
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ALCOR_PRIVATE_STATE_DIR:?Set the private application state directory}
        target: /var/lib/alcor/state
        bind:
          create_host_path: false
      - type: bind
        source: ${ALCOR_BACKUP_ARCHIVE_DIR:?Set the encrypted backup archive directory}
        target: /var/lib/alcor/backups
        bind:
          create_host_path: false
      - type: bind
        source: ${ALCOR_BACKUP_RECOVERY_KEY_DIR:?Set the independent backup recovery key directory}
        target: /var/lib/alcor/backup-key
        bind:
          create_host_path: false
    tmpfs:
      - /app/run:uid=10001,gid=10001,mode=0700
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 45s
  alcor-api-updater:
    image: ${ALCOR_DEPLOYMENT_IMAGE:?Set the application image repository}-updater:latest
    platform: ${ALCOR_PLATFORM:-linux/amd64}
    container_name: alcor-api-updater
    restart: unless-stopped
    environment:
      ALCOR_UPDATER_ORIGIN: http://app:8080
      ALCOR_UPDATER_TOKEN: ${ALCOR_DEPLOYMENT_RUNNER_TOKEN:?Set the private updater token}
      ALCOR_UPDATER_APP_IMAGE: ${ALCOR_DEPLOYMENT_IMAGE:?Set the application image repository}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_DIR:?Set the registry login configuration directory}:/config:ro
      - updater-state:/state
    networks: [update-control]
    read_only: true
    tmpfs: ["/tmp:mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: alcor-api
networks:
  update-control:
    internal: true
  existing-data:
    external: true
    name: ${ALCOR_EXISTING_NETWORK:?Set the verified existing PostgreSQL/Redis network}

volumes:
  updater-state:
