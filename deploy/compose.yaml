# Application only. PostgreSQL, Redis and Watchtower are independently managed.
name: alcor-api
services:
  app:
    container_name: alcor-api
    platform: ${ALCOR_PLATFORM:-linux/amd64}
    image: ${ALCOR_APP_IMAGE:?Set the application latest image reference}
    restart: unless-stopped
    init: true
    env_file:
      - ./app.env
    environment:
      ALCOR_DEPLOYMENT_UPDATER_URL: ${ALCOR_DEPLOYMENT_UPDATER_URL:-}
    ports:
      - "127.0.0.1:${ALCOR_HOST_PORT:-8088}:8080"
    networks:
      - existing-data
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: alcor-api
    read_only: true
    volumes:
      # Private application files; avatars currently remain in PostgreSQL.
      - type: bind
        source: ${ALCOR_UPLOADS_DIR:?Set the private uploads directory}
        target: /var/lib/alcor/uploads
        bind:
          create_host_path: false
      # Operator-managed assets. The container can read, but cannot change them.
      - type: bind
        source: ${ALCOR_ASSETS_DIR:?Set the private assets directory}
        target: /var/lib/alcor/assets
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ALCOR_PRIVATE_STATE_DIR:?Set the private application state directory}
        target: /var/lib/alcor/state
        bind:
          create_host_path: false
      - type: bind
        source: ${ALCOR_BACKUP_ARCHIVE_DIR:?Set the encrypted backup archive directory}
        target: /var/lib/alcor/backups
        bind:
          create_host_path: false
      - type: bind
        source: ${ALCOR_BACKUP_RECOVERY_KEY_DIR:?Set the independent backup recovery key directory}
        target: /var/lib/alcor/backup-key
        bind:
          create_host_path: false
    tmpfs:
      - /app/run:uid=10001,gid=10001,mode=0700
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 45s
networks:
  existing-data:
    external: true
    name: ${ALCOR_EXISTING_NETWORK:?Set the verified existing PostgreSQL/Redis network}
